name: Publish Python distribution to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after building (leave unchecked for a build-only dry run)"
        type: boolean
        default: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distribution
    needs:
    - tests
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0
        - name: Check version matches tag
          run: |
            TAG_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
            INIT_VERSION=$(grep -Po '(?<=__version__ = ")[^"]*' crucible/__init__.py)
            if [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
              echo "Version mismatch: tag=$TAG_VERSION, __init__.py=$INIT_VERSION"
              exit 1
            fi
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: "3.x"
        - name: Install pypa/build
          run: python3 -m pip install build --user
        - name: Build a binary wheel and a source tarball
          run: python -m build
        - name: Store the distribution packages
          uses: actions/upload-artifact@v7
          with:
            name: python-package-distributions
            path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: github.event_name == 'release' || inputs.publish

    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://pypi.org/p/nano-crucible

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
        - name: Download all the dists
          uses: actions/download-artifact@v8
          with:
            name: python-package-distributions
            path: dist/
        - name: Publish distribution to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
